[pytest]
# Добавляем опции для каждого запуска тестов, чтобы не прописывать их вручную
addopts = -s -v

python_files = *_tests.py test_*.py
python_classes = Test*
python_functions = test_*

# Регистрируем кастомные маркировки
markers=
    ui: Маркировка для запуска всех UI автотестов
    regression: Маркировка для регрессионных тестов
    registration: Маркировка для тестов с регистрацией пользователя
    dashboard: Маркировка для тестов, связанный с рабочей панелью
    slow: Маркировка для медленных тестов
    smoke: Маркировка для смок тестов
    critical: Маркировка для критичных тестов
    authorization: Маркировка для тестов, связанных с авторизацией
    courses: Маркировка для тестов связанных с курсами